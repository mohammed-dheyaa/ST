<style>
:root{color-scheme:dark;--ink:#f5ead4;--muted:#c9c2b0;--gold:#e9bd64;--line:#59694c}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:radial-gradient(ellipse at 50% -15%,#35452d 0,#18231b 42%,#0d120f 100%);font-family:Tahoma,Arial,sans-serif;color:var(--ink);min-height:100vh}
.wrap{max-width:540px;margin:auto}
.panel{background:#202c23;border:1px solid var(--line);border-radius:16px;padding:15px;color:#f5ead4;box-shadow:0 12px 28px #0005}
.lang{position:absolute;top:12px;left:12px;width:auto;padding:6px 12px;background:#39443c;color:#fff1d8;border:1px solid #77836c;font-size:12px;border-radius:7px}.panel{position:relative}header{text-align:center;border-bottom:1px solid #64704e;padding:5px 0 13px;margin-bottom:13px}
.company{color:var(--gold);font-size:16px;font-weight:bold}
.eyebrow{font-size:11px;color:#c9c2b0;letter-spacing:2px;margin:6px}
h1{font-size:21px;margin:8px 0}
.subtitle,.muted{font-size:11px;color:#c9c2b0;line-height:1.7}
.section{font-weight:bold;color:var(--gold);font-size:13px;margin:15px 0 5px}
label{display:block;font-size:12px;margin:10px 0 5px;color:#eee4d2}
input,select{box-sizing:border-box;width:100%;height:42px;min-width:0;border-radius:8px;border:1px solid #69735e;background:#121b16;color:#fff1d8;padding:6px;font-size:14px;text-align:center}
select{appearance:auto;direction:rtl}
input::placeholder{color:#a5a38e;opacity:.82;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.dategrid,.timegrid{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:6px}
button{width:100%;border:0;border-radius:9px;padding:14px;font-size:15px;font-weight:bold;cursor:pointer}
.calc{background:#dda63f;color:#21190d;margin-top:17px}
.clear{background:#39443c;color:#fff1d8;border:1px solid #77836c;margin-top:9px}

.result.show{display:block}
.big{font-size:21px;font-weight:bold;margin:10px 0;color:#ffe4a5}
.error{display:none;background:#542b24;color:#ffe1d9;padding:10px;border-radius:8px;margin-top:10px;font-size:12px}
.error.show{display:block}
.live{color:#a8c58b;margin-top:7px}
.footer{text-align:center;margin-top:10px}
[hidden]{display:none!important}
@media(max-width:350px){.grid{gap:6px}.dategrid,.timegrid{gap:4px}input,select{font-size:12px;padding:3px}}

/* MOC clean orange interface refresh */
:root{color-scheme:light;--ink:#303238;--muted:#85858a;--gold:#f47d3d;--line:#f0e5d9}
*{box-sizing:border-box}
body{margin:0;padding:22px 14px 30px;background:#f2f0df;color:var(--ink);font-family:"Tahoma",Arial,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto}
.panel{position:relative;overflow:visible;background:#fff;border:0;border-radius:25px;padding:0 19px 22px;color:#303238;box-shadow:0 12px 35px rgba(78,65,45,.10)}
.lang{position:absolute;z-index:2;top:18px;left:18px;width:44px;height:44px;min-width:44px;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.55);font-size:12px;font-weight:800;border-radius:50%;backdrop-filter:blur(8px)}
header{margin:0 -19px 18px;padding:25px 22px 18px;text-align:center;background:linear-gradient(145deg,#fa8a48,#f47735);border:0;border-radius:0 0 34px 34px;color:#fff;min-height:0}
.company{font-size:28px;font-weight:800;letter-spacing:.2px;color:rgba(255,255,255,.76);margin:0 0 8px;text-shadow:0 1px 8px rgba(255,255,255,.18);text-align:center}
.eyebrow{display:none}
h1{font-size:11.5px;line-height:1.7;margin:0 0 1px;color:#fff;font-weight:700}
.subtitle{font-size:11.5px;color:rgba(255,255,255,.85);line-height:1.7}
.muted{font-size:11px;color:#929297;line-height:1.8}
.section{font-weight:800;color:#e8753b;font-size:14px;margin:20px 0 8px;padding-right:10px;border-right:3px solid #f58a51}
label{display:block;font-size:12px;margin:11px 0 6px;color:#515158;font-weight:700}
input,select{width:100%;height:46px;min-width:0;border-radius:13px;border:1px solid #eee9e3;background:#faf9f6;color:#333;padding:7px 10px;font-size:14px;text-align:center;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:#f59a6a;box-shadow:0 0 0 3px rgba(244,125,61,.12)}
select{appearance:auto;direction:rtl}
input::placeholder{color:#b5b1ac;opacity:1;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dategrid,.timegrid{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px}
button{width:100%;border:0;border-radius:14px;padding:14px;font-size:14px;font-weight:800;cursor:pointer;transition:transform .15s,filter .15s}
button:active{transform:scale(.985)}
.calc{background:linear-gradient(135deg,#fa914f,#f47735);color:white;margin-top:18px;box-shadow:0 7px 16px rgba(244,125,61,.22)}
.clear{background:linear-gradient(135deg,#fa914f,#f47735);color:#fff;border:0;margin-top:12px;box-shadow:0 7px 16px rgba(244,125,61,.22)}
.result{display:none;background:#fff8f2;border:1px solid #f6d8c5;border-radius:18px;padding:16px;margin-top:15px;text-align:center}
.result.show{display:block}
.big{font-size:22px;font-weight:800;margin:10px 0;color:#ed783d}
.error{display:none;background:#fff0ec;color:#b94c35;padding:12px;border-radius:12px;margin-top:12px;font-size:12px;border:1px solid #f5d2c8}
.error.show{display:block}
.live{color:#dc8154;margin-top:8px}
.footer{text-align:center;margin-top:16px;color:#aaa;font-size:10px;letter-spacing:.5px}
[hidden]{display:none!important}
.edit-toggle{display:flex;align-items:center;gap:8px;margin:8px 0 10px;font-size:11px;color:#777;font-weight:600;cursor:pointer}
.edit-toggle input{width:15px;height:15px;min-width:15px;accent-color:#f47735;margin:0;cursor:pointer}
#dateTimeEditor{padding:9px 10px 10px;margin-top:6px;border:1px solid #f1e5dc;border-radius:13px;background:#fdfbf8}
#dateTimeEditor label{font-size:10px;margin:5px 0 4px}
#dateTimeEditor select{height:30px;padding:3px 4px;font-size:11px;border-radius:8px}
#dateTimeEditor .dategrid,#dateTimeEditor .timegrid{gap:5px}
#dateTimeEditor .muted{font-size:9px;margin-top:6px}
@media(min-width:600px){body{padding-top:35px}.panel{padding-left:24px;padding-right:24px}header{margin-left:-24px;margin-right:-24px;padding-left:28px;padding-right:28px}}
@media(max-width:350px){.grid{gap:7px}.dategrid,.timegrid{gap:5px}input,select{font-size:12px;padding:3px}.panel{padding-left:13px;padding-right:13px}header{margin-left:-13px;margin-right:-13px;padding-left:17px;padding-right:17px}}
/* Fit company title on narrow Android screens; keep the existing font family/style */
@media(max-width:430px){.company{font-size:22px;letter-spacing:0}}
@media(max-width:360px){.company{font-size:19px}}


/* Olive green theme: same layout and components, alternate palette only */

.tank-transfer{margin-top:13px;gap:10px}
.tank-transfer label{margin-top:7px}
.tank-transfer select{height:42px}

.print-transfer{margin-top:18px;background:linear-gradient(135deg,#fa914f,#f47735);color:#fff;border:0;box-shadow:0 7px 16px rgba(244,125,61,.22)}
/* Match print actions and preview surface to the selected visual style. */
body.olive .print-transfer{background:linear-gradient(135deg,#8c9f58,#596f35);color:#fff;border:0;box-shadow:0 7px 16px rgba(91,112,52,.22)}
body.olive .print-page{background:#eef0df}
body.olive .print-toolbar button{background:linear-gradient(135deg,#8c9f58,#596f35);box-shadow:0 7px 16px rgba(91,112,52,.22)}
body.olive .print-preview{box-shadow:0 12px 35px rgba(62,78,39,.12)}
.print-transfer:hover{filter:brightness(1.04)}
.print-page{position:fixed;inset:0;z-index:20;overflow:auto;background:#f2f0df;padding:16px}
.print-toolbar{max-width:560px;margin:0 auto 12px;display:flex;gap:9px}
.print-toolbar button{flex:1;background:linear-gradient(135deg,#fa914f,#f47735);color:#fff;padding:12px}
.print-preview{max-width:560px;margin:0 auto;background:#fff;border-radius:20px;padding:10px;box-shadow:0 12px 35px rgba(78,65,45,.10)}
.print-preview img{display:block;width:100%;height:auto;border-radius:12px}
.share-action{width:100%;margin:14px auto 0;padding-bottom:10px;display:flex;justify-content:center}
.share-action button{width:auto;max-width:100%;min-height:44px;padding:0 19px;border:1px solid rgba(255,255,255,.28);border-radius:18px;background:linear-gradient(135deg,#fa914f,#f47735);color:#fff;font-size:15px;font-weight:700;box-shadow:0 5px 14px rgba(244,125,61,.22);display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;transition:filter .15s,transform .15s}
.share-action button:active{transform:scale(.985)}
.share-action{align-items:center;gap:13px}


@media print{body>*{display:none!important}.print-page{display:block!important;position:static;background:white;padding:0}.print-toolbar{display:none}.print-preview{box-shadow:none;max-width:none}}

</style>

<style>

<style>

body.theme-flame,body.theme-copper,body.theme-oxide,body.theme-retro,body.theme-midnight-plum,body.theme-burgundy{background:radial-gradient(ellipse at top left,color-mix(in srgb,var(--page) 82%,#fff),var(--page) 66%);color:var(--ink-theme)}

<body>
<main class="wrap">

<option value="TK1003">TK1003</option>
<option value="TK1004">TK1004</option>
<option value="TK1005">TK1005</option>
<option value="TK1006">TK1006</option>
<option value="TK1007">TK1007</option>

<div class="grid">

</div>

  <input id="editDateTime" type="checkbox">
  <span data-ar="تعديل التاريخ والوقت يدوياً" data-en="Manually edit date and time">تعديل التاريخ والوقت يدوياً</span>
</label>

<div><label for="day" data-ar="اليوم" data-en="Day">اليوم</label><select id="day"></select></div>

</div>

<button class="calc" id="calculate" type="button" data-ar="احسب وقت التحويل" data-en="Calculate Change Time">احسب وقت التحويل</button>

<div class="big" id="duration"></div>
<div class="muted" data-ar="المدة اللازمة لإتمام التحويل" data-en="Time Required to Complete the Change">المدة اللازمة لإتمام التحويل</div>
<hr style="border:0;border-top:1px solid #71815b;margin:13px 0">
<div style="color:#e9bd64" data-ar="وقت التحويل" data-en="Change Time">وقت التحويل</div>
<div class="big" id="arrival"></div>
<div class="muted" id="arrival-date"></div>
</div>
</div>
<button class="clear" id="clear" type="button" data-ar="إعادة تعيين" data-en="Reset">إعادة تعيين</button>
<div class="muted footer">By : Mohammed Dheyaa</div>
</main>
<section id="printPage" class="print-page" hidden aria-label="معاينة التحويل">
  <div class="print-preview"><img id="transferImage" alt="بيانات التحويل"></div>
  <div class="share-action">
    <button id="closePrint" class="back-action" type="button"><span class="back-label" data-ar="رجوع" data-en="Back">رجوع</span><span class="back-arrow" aria-hidden="true">←</span></button>
    <button id="shareTransfer" type="button" aria-label="مشاركة الصورة"><span class="share-label" data-ar="مشاركة الصورة" data-en="Share Image">مشاركة الصورة</span><span class="share-arrow" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><path d="M7 39c4-13 12-21 25-25l-1-8 12 12-12 12-1-8C19 27 13 32 7 39Z" fill="currentColor"/></svg></span></button>
  </div>
</section>
<script>
(()=>{
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
let manuallyEdited=false,language='ar',calculatedAt=null;
function setLanguage(lang){language=lang;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-ar][data-en]').forEach(el=>{const value=el.dataset[lang];if(el.tagName==='OPTION')el.textContent=value;else el.textContent=value});document.querySelectorAll('[data-en-placeholder]').forEach(el=>{if(el.id!=='current'&&el.id!=='target')el.placeholder=lang==='en'?el.dataset.enPlaceholder:el.getAttribute('placeholder-ar')||({'rate':'مثلاً 1.28','flow':'مثلاً 2200'}[el.id]||'')});updateLevelPlaceholders();$('language').textContent=lang==='ar'?'EN':'AR';$('styleToggle').textContent=lang==='ar'?'نمط':'Style';document.title=lang==='ar'?'حساب وقت التحويل | MOC':'Change Time Calculator | MOC';$('live').textContent=manuallyEdited?(lang==='ar'?'● تاريخ ووقت محددان يدوياً':'● Manually selected date and time'):(lang==='ar'?'● الوقت والتاريخ الفعلي للجهاز':'● Current device date and time');}
$('language').addEventListener('click',()=>setLanguage(language==='ar'?'en':'ar'));
const themeNames=['flame','copper','oxide','retro','midnight-plum','burgundy'];
function applyTheme(theme){
 if(!themeNames.includes(theme))theme='flame';
 document.body.classList.remove('theme-flame','theme-copper','theme-oxide','theme-pistachio','theme-retro','theme-midnight-plum','theme-burgundy','olive');
 document.body.classList.add('theme-'+theme);
 try{localStorage.setItem('moc-selected-theme',theme)}catch(e){}
 document.querySelectorAll('.theme-choice').forEach(b=>{
  b.classList.toggle('selected',b.dataset.theme===theme);
  b.setAttribute('aria-pressed',String(b.dataset.theme===theme));
 });
}
$('styleToggle').addEventListener('click',()=>{
 const menu=$('styleMenu');menu.hidden=!menu.hidden;
 $('styleToggle').setAttribute('aria-expanded',String(!menu.hidden));
});
document.querySelectorAll('.theme-choice').forEach(b=>b.addEventListener('click',()=>{
 applyTheme(b.dataset.theme);$('styleMenu').hidden=true;$('styleToggle').setAttribute('aria-expanded','false');
}));
document.addEventListener('click',e=>{
 if(!e.target.closest('#styleToggle')&&!e.target.closest('#styleMenu')){
  $('styleMenu').hidden=true;$('styleToggle').setAttribute('aria-expanded','false');
 }
});
let savedTheme='flame';try{savedTheme=localStorage.getItem('moc-selected-theme')||'flame';if(savedTheme==='tangerine')savedTheme='flame';if(savedTheme==='powder')savedTheme='midnight-plum'}catch(e){}
applyTheme(savedTheme);
const messages={incomplete:['يرجى إكمال الحقول واختيار تاريخ ووقت صحيحين.','Complete all fields and select a valid date and time.'],levels:['تحقق من مستويات الخزان.','Check the tank levels.'],rate:['معدل العملية يجب أن يكون أكبر من صفر.','The operation rate must be greater than zero.'],equal:['المستوى الحالي يساوي المستوى المطلوب.','The current level equals the target level.'],receive:['في عملية استلام النفط يجب أن يكون المستوى المطلوب أعلى من الحالي.','For oil receipt, the target level must be higher than the current level.'],pump:['في عملية ضخ النفط يجب أن يكون المستوى المطلوب أقل من الحالي.','For oil pumping, the target level must be lower than the current level.'],calc:['تعذر حساب وقت التحويل.','Unable to calculate the change time.']};
function message(key){return messages[key][language==='ar'?0:1]}

function options(id,from,to,format=x=>String(x)){
 const s=$(id);
 for(let i=from;i<=to;i++){const o=document.createElement('option');o.value=String(i);o.textContent=format(i);s.appendChild(o)}
}
options('day',1,31,pad);options('month',1,12,pad);
const y=new Date().getFullYear();options('year',y-2,y+10);
options('hour',1,12,pad);options('minute',0,59,pad);
function setNow(){
 const d=new Date();
 $('day').value=String(d.getDate());$('month').value=String(d.getMonth()+1);$('year').value=String(d.getFullYear());
 $('hour').value=String(d.getHours()%12||12);$('minute').value=String(d.getMinutes());
 $('period').value=d.getHours()>=12?'PM':'AM';
 $('live').textContent=language==='ar'?'● الوقت والتاريخ الفعلي للجهاز':'● Current device date and time';
}
function updateLevelPlaceholders(){
 const pump=$('operation').value==='pump';
 const currentValue=pump?'12':'3.8',targetValue=pump?'3.8':'12';
 $('current').placeholder=language==='en'?'e.g. '+currentValue:'مثلاً '+currentValue;
 $('target').placeholder=language==='en'?'e.g. '+targetValue:'مثلاً '+targetValue;
}
function toggle(){
 const p=$('operation').value==='pump';$('receive').hidden=p;$('pump').hidden=!p;
 updateLevelPlaceholders();
 $('result').classList.remove('show');$('printTransfer').hidden=true;$('error').classList.remove('show');
}
function selectedDate(){
 if(!$('editDateTime').checked)return new Date();
 const day=+$('day').value,month=+$('month').value,year=+$('year').value,hour=+$('hour').value,minute=+$('minute').value;
 if(!day||!month||!year||!hour||$('minute').value===''||!$('period').value)return null;
 const dt=new Date(year,month-1,day,(hour%12)+($('period').value==='PM'?12:0),minute,0,0);
 return dt.getFullYear()===year&&dt.getMonth()===month-1&&dt.getDate()===day?dt:null;
}
['day','month','year','hour','minute','period'].forEach(id=>$(id).addEventListener('change',()=>{
 if($('editDateTime').checked){
  manuallyEdited=true;$('live').textContent=language==='ar'?'● تاريخ ووقت محددان يدوياً':'● Manually selected date and time';
 }
 $('result').classList.remove('show');
}));
$('editDateTime').addEventListener('change',()=>{
 const enabled=$('editDateTime').checked;
 $('dateTimeEditor').hidden=!enabled;
 manuallyEdited=enabled;
 $('live').textContent=enabled
  ?(language==='ar'?'● تاريخ ووقت محددان يدوياً':'● Manually selected date and time')
  :(language==='ar'?'● الوقت والتاريخ الفعلي للجهاز':'● Current device date and time');
 $('result').classList.remove('show');
 $('error').classList.remove('show');
});
$('operation').addEventListener('change',toggle);
$('calculate').addEventListener('click',()=>{
 $('error').classList.remove('show');$('result').classList.remove('show');
 const pump=$('operation').value==='pump',a=Number($('current').value),b=Number($('target').value);
 const rateInput=pump?'flow':'rate',raw=Number($(rateInput).value);
 // Keep the existing conversion formula unchanged.
 const rate=pump?raw*6.289/11111:raw,dt=selectedDate();let msg='';
 if($('current').value===''||$('target').value===''||$(rateInput).value===''||!dt)msg=message('incomplete');
 else if(!Number.isFinite(a)||!Number.isFinite(b)||a<0||b<0)msg=message('levels');
 else if(!Number.isFinite(rate)||rate<=0)msg=message('rate');
 else if(a===b)msg=message('equal');
 else if(!pump&&b<a)msg=message('receive');
 else if(pump&&b>a)msg=message('pump');
 if(msg){$('error').textContent=msg;$('error').classList.add('show');return}
 const mins=Math.round(Math.abs(b-a)/rate*60),out=new Date(dt.getTime()+mins*60000);
 if(!Number.isFinite(out.getTime())){$('error').textContent=message('calc');$('error').classList.add('show');return}
 $('duration').textContent=language==='ar'?(Math.floor(mins/60)+' ساعة و '+mins%60+' دقيقة'):(Math.floor(mins/60)+' hours And '+mins%60+' minutes');
 $('arrival').textContent=pad(out.getHours()%12||12)+':'+pad(out.getMinutes())+' '+(out.getHours()>=12?'PM':'AM');
 $('arrival-date').textContent=language==='ar'?('التاريخ: '+pad(out.getDate())+'/'+pad(out.getMonth()+1)+'/'+out.getFullYear()):('Date: '+pad(out.getDate())+'/'+pad(out.getMonth()+1)+'/'+out.getFullYear());
 $('result').classList.add('show');
 calculatedAt=new Date();
 $('printTransfer').hidden=false;
 setTimeout(()=>{prepareShare().catch(()=>{})},60);
});
function xmlSafe(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));}
function getTransferData(){
 const stamp=calculatedAt||new Date(),en=language==='en';
 const weekdaysAr=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
 const weekdaysEn=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
 const date=pad(stamp.getDate())+'/'+pad(stamp.getMonth()+1)+'/'+stamp.getFullYear()+' - '+(en?weekdaysEn:weekdaysAr)[stamp.getDay()];
 const rawTime=$('arrival').textContent.trim();
 const time=en?rawTime:rawTime.replace(/\s*AM$/i,' صباحاً').replace(/\s*PM$/i,' مساءً');
 const from=$('fromTank').value,to=$('toTank').value;
 const operation=$('operation').value==='pump'?(en?'Change Pumping':'تحويل الضخ'):(en?'Change Receiving':'تحويل الاستلام');
 const paletteKey=['flame','copper','oxide','retro','midnight-plum','burgundy'].find(t=>document.body.classList.contains('theme-'+t))||'flame';
 const palettes={
  flame:{start:'#FF7F50',end:'#F36B3D',page:'#FFF1EC',paper:'#FFFFFF',border:'#FFD0C1',accent:'#FF7F50',box:'#FFF5F1',boxBorder:'#FFD0C1',muted:'#A66F5D',ink:'#713522',shadow:'#B95A3B'},
  copper:{start:'#B5602F',end:'#93451F',page:'#F5EAE3',paper:'#FFFFFF',border:'#E8C8B5',accent:'#B5602F',box:'#FBF3EE',boxBorder:'#E8C8B5',muted:'#967461',ink:'#713B20',shadow:'#8C4B2B'},
  oxide:{start:'#16394F',end:'#0E2D40',page:'#E8F0F4',paper:'#FFFFFF',border:'#C8D9E2',accent:'#16394F',box:'#F0F5F8',boxBorder:'#C8D9E2',muted:'#6E8796',ink:'#16394F',shadow:'#244B61'},

 T(d.operation,540,178,'bold 50px '+F,'#fff',d.dir);
 T(d.date,540,330,'40px '+F,'#fff',d.dir);
 T(d.en?'Time':'الوقت',540,545,'bold 30px '+F,p.muted,d.dir);

 [115,665].forEach(bx=>{rrPath(x,bx,700,300,160,28);x.fill();x.stroke();});

const shareState={key:null,promise:null};
function getCapPlugin(n){try{const cap=window.Capacitor;return (cap&&cap.Plugins&&cap.Plugins[n])||(cap&&typeof cap.registerPlugin==='function'?cap.registerPlugin(n):null);}catch(e){return null;}}
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onloadend=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b);});}
function prepareShare(){
 const d=getTransferData();
 if(shareState.key===d.key&&shareState.promise)return shareState.promise;
 shareState.key=d.key;
 const pr=(async()=>{
  const blob=await new Promise(r=>renderTransferCanvas(d).toBlob(r,'image/jpeg',.92));
  if(!blob)throw new Error('blob');
  let uri=null;const FS=getCapPlugin('Filesystem');
  if(FS&&typeof FS.writeFile==='function'){
   try{const saved=await FS.writeFile({path:'MOC-Transfer.jpg',data:await blobToB64(blob),directory:'CACHE'});uri=saved.uri;}catch(e){}
  }
  return {blob,uri};
 })();
 shareState.promise=pr;
 pr.catch(()=>{if(shareState.promise===pr){shareState.promise=null;shareState.key=null;}});
 return pr;
}
let mocToast=null;
function showToast(msg){if(!mocToast){mocToast=document.createElement('div');mocToast.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:99998;background:rgba(0,0,0,.82);color:#fff;padding:11px 20px;border-radius:999px;font:700 14px Tahoma,Arial,sans-serif;direction:rtl';document.body.appendChild(mocToast);}mocToast.textContent=msg;mocToast.style.display='block';}
function hideToast(){if(mocToast)mocToast.style.display='none';}
function showShareFallback(blob,ar){
 const url=URL.createObjectURL(blob);
 const ov=document.createElement('div');
 ov.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px;direction:rtl;font-family:Tahoma,Arial,sans-serif';
 ov.innerHTML='<div style="color:#fff;font-size:14px;text-align:center;line-height:1.8">'+(ar?'اضغط مطولاً على الصورة ثم اختر حفظ أو مشاركة':'Long-press the image, then choose Save or Share')+'</div><img src="'+url+'" style="max-width:100%;max-height:68vh;border-radius:12px;background:#fff"><div style="display:flex;gap:10px;width:100%;max-width:360px"><a href="'+url+'" download="MOC-Transfer.jpg" style="flex:1;text-align:center;background:#f47d3d;color:#fff;padding:13px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:14px">'+(ar?'حفظ الصورة':'Save image')+'</a><button id="mocClose" type="button" style="flex:1;background:#fff;color:#333;padding:13px;border-radius:12px;font-weight:bold;font-size:14px;border:0">'+(ar?'إغلاق':'Close')+'</button></div>';
 document.body.appendChild(ov);
 ov.querySelector('#mocClose').onclick=()=>{ov.remove();URL.revokeObjectURL(url);};
}
let sharing=false;
$('shareTransfer').addEventListener('click',async()=>{
 const ar=language==='ar';
 if(!$('result').classList.contains('show')){
  alert(ar?'احسب التحويل أولاً ثم اضغط مشاركة الصورة':'Calculate the transfer first, then share the image');return;
 }
 if(sharing)return;sharing=true;
 const slow=setTimeout(()=>showToast(ar?'جارٍ تجهيز الصورة…':'Preparing image…'),120);
 const isCancel=err=>{const m=String((err&&(err.message||err.errorMessage||err.code))||err);return /cancel|abort|dismiss/i.test(m)||(err&&err.name==='AbortError');};
 try{
  const {blob,uri}=await prepareShare();
  clearTimeout(slow);hideToast();
  const Share=getCapPlugin('Share');
  if(uri&&Share&&typeof Share.share==='function'){
   try{await Share.share({files:[uri],dialogTitle:ar?'مشاركة الصورة':'Share image'});return;}
   catch(err){if(isCancel(err))return;}
  }
  try{
   const file=new File([blob],'MOC-Transfer.jpg',{type:'image/jpeg'});
   if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({files:[file]});return;}
  }catch(err){if(isCancel(err))return;}
  showShareFallback(blob,ar);
 }catch(e){alert(ar?'تعذر تجهيز الصورة':'Could not create image');}
 finally{clearTimeout(slow);hideToast();sharing=false;}
});
